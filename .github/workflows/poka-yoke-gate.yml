name: Poka-Yoke Build Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  build-gate:
    name: Security and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Terraform Format Gate
        run: |
          terraform fmt -check -recursive terraform/

      - name: Terraform Validation Gate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Python Linter Gate
        run: |
          ruff check api/ --output-format=concise

      - name: Python Formatting Gate
        run: |
          ruff format --check api/

      - name: Secret Detection Gate
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail Closed on Security Failure
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::CRITICAL SECURITY FAILURE: Hardcoded secrets detected."
          echo "Build is quarantined and deployment is blocked."
          exit 1

      - name: Build Gate Passed
        run: |
          echo "=========================================="
          echo "Poka-Yoke Build Gate PASSED"
          echo "Terraform validation: PASSED"
          echo "Python linting: PASSED"
          echo "Python formatting: PASSED"
          echo "Secret scanning: PASSED"
          echo "Deployment may proceed."
          echo "=========================================="
